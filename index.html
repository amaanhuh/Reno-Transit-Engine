    <script>
      // Ensure window.fetch has both getter and setter so browser extensions don't crash when overriding fetch
      try {
        var _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() {
            return _fetch;
          },
          set: function(fn) {
            _fetch = fn;
          }
        });
      } catch (e) {}

      // Suppress external extension injection errors
      window.addEventListener('error', function(e) {
        if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('only a getter') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
